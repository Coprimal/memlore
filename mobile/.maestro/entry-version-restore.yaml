# Version history (M3b task 4.7). The first save of a brand-new entry finds a
# blank stored doc, so no version; the first save of the next session keeps the
# stored text as a version; restoring it brings the text back.
#
# Runs against the Release simulator build (see vault-create-unlock.yaml):
#   pnpm mobile:ios:release
#   pnpm mobile:e2e
# clearState wipes the app's container, so the flow creates its own vault.
appId: app.memlore.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: backup-notice
    timeout: 15000
- tapOn:
    id: password-input
- inputText: "12345678"
- tapOn:
    id: confirm-password-input
- inputText: "12345678"
- tapOn:
    id: create-vault-button
- extendedWaitUntil:
    visible:
      id: recovery-phrase
    timeout: 30000
- tapOn:
    id: phrase-saved-button
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 15000

# Session 1: type, Back (the save flushes; no version of a blank doc).
- tapOn:
    id: new-entry-button
- extendedWaitUntil:
    notVisible:
      id: entry-placeholder
    timeout: 15000
- tapOn:
    point: "50%,40%"
- inputText: "alpha one"
- tapOn:
    point: "10%,7%"
- extendedWaitUntil:
    visible:
      text: ".*alpha one.*"
    timeout: 10000

# Session 2: reopen, add text, Back (this save first keeps "alpha one").
- tapOn:
    id: entry-row-0
- extendedWaitUntil:
    notVisible:
      id: entry-placeholder
    timeout: 15000
- tapOn:
    point: "50%,60%"
- inputText: " beta"
- tapOn:
    point: "10%,7%"
- extendedWaitUntil:
    visible:
      text: ".*alpha one beta.*"
    timeout: 10000

# Restore the kept version.
- tapOn:
    id: entry-row-0
- extendedWaitUntil:
    notVisible:
      id: entry-placeholder
    timeout: 15000
- tapOn:
    id: entry-menu
- tapOn: "Version history"
- extendedWaitUntil:
    visible:
      id: version-row-0
    timeout: 10000
- assertVisible:
    id: version-row-0
    text: ".*alpha one.*"
- tapOn:
    id: version-row-0
- extendedWaitUntil:
    visible:
      id: version-restore-button
    timeout: 10000
- tapOn:
    id: version-restore-button
- extendedWaitUntil:
    visible: "Restore this version?"
    timeout: 5000
- tapOn:
    text: "Restore"
    index: 1
- extendedWaitUntil:
    notVisible:
      text: ".*beta.*"
    timeout: 15000
- assertVisible: ".*alpha one.*"

# Back: the restored text is saved and listed.
- tapOn:
    point: "10%,7%"
- extendedWaitUntil:
    visible:
      text: ".*alpha one.*"
    timeout: 10000
- assertNotVisible:
    text: ".*beta.*"
