# Trash an entry, restore it, trash it again and empty the trash (M3a task
# 4.6). Move to Trash asks for confirmation (decision 7).
#
# Runs against the Release simulator build (see vault-create-unlock.yaml):
#   pnpm mobile:ios:release
#   pnpm mobile:e2e
# clearState wipes the app's container, so the flow creates its own vault.
appId: app.memlore.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: backup-notice
    timeout: 15000
- tapOn:
    id: password-input
- inputText: "12345678"
- tapOn:
    id: confirm-password-input
- inputText: "12345678"
- tapOn:
    id: create-vault-button
- extendedWaitUntil:
    visible:
      id: recovery-phrase
    timeout: 30000
- tapOn:
    id: phrase-saved-button
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 15000

# An entry with a unique title.
- tapOn:
    id: new-entry-button
# The placeholder covers the title field until the editor is ready.
- extendedWaitUntil:
    notVisible:
      id: entry-placeholder
    timeout: 15000
- tapOn:
    id: entry-title-input
- inputText: "Trash me 4.6"
- tapOn:
    point: "10%,7%"
- extendedWaitUntil:
    visible:
      text: ".*Trash me 4.6.*"
    timeout: 10000

# Move to Trash, confirm: the row leaves the list.
- tapOn:
    text: ".*Trash me 4.6.*"
- extendedWaitUntil:
    visible:
      id: entry-menu
    timeout: 15000
- tapOn:
    id: entry-menu
- tapOn: "Move to Trash"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 5000
- tapOn:
    text: "Move to Trash"
    index: 1
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 10000
- assertNotVisible:
    text: ".*Trash me 4.6.*"

# Restore it from the trash: it is listed again.
- tapOn:
    id: settings-tab
- tapOn:
    id: trash-row
- extendedWaitUntil:
    visible:
      text: ".*Trash me 4.6.*"
    timeout: 10000
- tapOn:
    id: restore-button
- extendedWaitUntil:
    visible:
      id: trash-empty
    timeout: 10000
- tapOn:
    point: "10%,7%"
- tapOn:
    id: entries-tab
- extendedWaitUntil:
    visible:
      text: ".*Trash me 4.6.*"
    timeout: 10000

# Trash it again, then empty the trash.
- tapOn:
    text: ".*Trash me 4.6.*"
- extendedWaitUntil:
    visible:
      id: entry-menu
    timeout: 15000
- tapOn:
    id: entry-menu
- tapOn: "Move to Trash"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 5000
- tapOn:
    text: "Move to Trash"
    index: 1
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 10000
- tapOn:
    id: settings-tab
- tapOn:
    id: trash-row
- extendedWaitUntil:
    visible:
      id: empty-trash-button
    timeout: 10000
- tapOn:
    id: empty-trash-button
- extendedWaitUntil:
    visible: "Empty trash?"
    timeout: 5000
- tapOn:
    text: "Empty trash"
    index: 1
- extendedWaitUntil:
    visible:
      id: trash-empty
    timeout: 10000
