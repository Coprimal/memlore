# Write and read an entry (M3a task 3.8). Flow 1: text typed just before Back
# is saved (the leave flush). Flow 2: text typed just before Home is saved
# before an immediate auto-lock (save before lock), and the lock removes the
# entry screen.
#
# Runs against the Release simulator build (see vault-create-unlock.yaml):
#   pnpm mobile:ios:release
#   pnpm mobile:e2e
# clearState wipes the app's container, so the flow creates its own vault.
appId: app.memlore.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: backup-notice
    timeout: 15000
- tapOn:
    id: password-input
- inputText: "12345678"
- tapOn:
    id: confirm-password-input
- inputText: "12345678"
- tapOn:
    id: create-vault-button
- extendedWaitUntil:
    visible:
      id: recovery-phrase
    timeout: 30000
- tapOn:
    id: phrase-saved-button
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 15000

# Flow 1: type, press Back at once; the list and a reopen show the text.
- tapOn:
    id: new-entry-button
- extendedWaitUntil:
    notVisible:
      id: entry-placeholder
    timeout: 15000
- tapOn:
    point: "50%,40%"
- inputText: "first phrase kept on back"
- tapOn:
    point: "10%,7%"
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 10000
- assertVisible:
    text: ".*first phrase kept on back.*"
- tapOn:
    id: entry-row-0
- extendedWaitUntil:
    notVisible:
      id: entry-placeholder
    timeout: 15000
- assertVisible:
    text: ".*first phrase kept on back.*"
- tapOn:
    point: "10%,7%"
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 10000

# Flow 2: immediate auto-lock. Type, press Home at once, come back: the vault
# is locked, the editor is gone, and after the unlock the list shows the text.
- tapOn:
    id: settings-tab
- tapOn:
    id: auto-lock-0
- tapOn:
    id: entries-tab
- tapOn:
    id: entry-row-0
- extendedWaitUntil:
    notVisible:
      id: entry-placeholder
    timeout: 15000
- tapOn:
    point: "50%,60%"
- inputText: " second phrase before lock"
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: unlock-button
    timeout: 15000
- assertNotVisible:
    id: entry-title-input
- tapOn:
    id: password-input
- inputText: "12345678"
- tapOn:
    id: unlock-button
- extendedWaitUntil:
    visible:
      id: entry-count
    timeout: 30000
- assertNotVisible:
    id: entry-title-input
- assertVisible:
    text: ".*second phrase before lock.*"

# Leave the vault on the 1-minute default.
- tapOn:
    id: settings-tab
- tapOn:
    id: auto-lock-60
- tapOn:
    id: entries-tab
